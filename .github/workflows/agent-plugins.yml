# Ships the plugins under agent-plugins/ from here: boykush/workflows writes and checks their
# apm.yml, and tags each version for consumers to pin.
name: agent-plugins

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  agent-plugins:
    uses: boykush/workflows/.github/workflows/agent-plugins.yml@a3c1c23e0131b5ff4d66a9fbadc5f06ad199d399
    with:
      path: agent-plugins
    permissions:
      contents: write
