# Ships the plugins under agent-plugins/ from here: boykush/workflows writes and checks their
# apm.yml, and tags each version for consumers to pin.
name: agent-plugins

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  agent-plugins:
    uses: boykush/workflows/.github/workflows/agent-plugins.yml@d39a40147bcbc982b297444e2241e7b149a04a45
    with:
      path: agent-plugins
    permissions:
      contents: write
