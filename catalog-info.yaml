# This repository's entities in boykush's Backstage catalog, found on main by its
# GitHub discovery (boykush/infrastructure-as-code's applications/backstage/).
# How an entity is written — which edges to draw, what a tag means — is set in
# boykush/github-management's AGENTS.md and the comments atop its catalog/ files.
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: backstage-app
  description: >-
    この catalog を画面と catalog-mcp で出す Backstage の app。create-app の雛形に AiResource kind を足して
    build し、image を infrastructure-as-code がデプロイする。出す entity は github-management の catalog/ と各 repo の catalog-info.yaml が持つ
  annotations:
    backstage.io/kubernetes-label-selector: app.kubernetes.io/part-of=backstage
  links:
    - url: https://backstage.boykush.com
      title: Backstage
      icon: dashboard
spec:
  type: repository
  lifecycle: production
  owner: user:boykush
  system: repo-governance
  providesApis:
    - catalog-mcp
  dependsOn:
    - component:github-management
    - component:workflows
    - resource:doks-cluster
    - resource:cloudflare-tunnel
    - resource:ghcr
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: catalog-mcp
  description: >-
    この catalog 自身を読む remote MCP サーバー。読み取り専用で、出ているのは entity を読む action と、entity と
    TechDocs を語で引く検索。Backstage が出している。入口は Cloudflare Access の OAuth で通るのは owner だけだが、
    ログインなしで引ける経路も残っている（infrastructure-as-code の terraform/access.tf）ので、public repo から
    作られるもの以外は出さない。公開エンドポイントは infrastructure-as-code が持つ
  links:
    - url: https://github.com/boykush/backstage-app/blob/main/agent-plugins/catalog-remote-mcp/mcp.json
      title: 接続先の持ち主（plugin catalog-remote-mcp）
      icon: github
spec:
  type: mcp-server
  lifecycle: production
  owner: user:boykush
  system: repo-governance
  remotes:
    - type: streamable-http
      url: https://catalog-mcp.boykush.com/mcp
---
apiVersion: backstage.io/v1alpha1
kind: AiResource
metadata:
  name: catalog-remote-mcp
  description: >-
    catalog-mcp への参照を1つ持つだけの plugin（Agent Plugins の形）。apm の package にして配るのは ai-plugins
  links:
    - url: https://backstage.boykush.com/catalog/default/api/catalog-mcp
      title: MCP サーバー（catalog-mcp）
      icon: kind:api
spec:
  type: plugin
  lifecycle: production
  owner: user:boykush
  system: repo-governance
  skills: []
